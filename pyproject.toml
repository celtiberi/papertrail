[project]
name = "papertrail"
version = "0.2.2"
description = "Zero-dependency per-turn state and decision provenance ledger for Python pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
papertrail = "papertrail.cli:main"

[project.urls]
Homepage = "https://github.com/celtiberi/papertrail"
Repository = "https://github.com/celtiberi/papertrail"
Issues = "https://github.com/celtiberi/papertrail/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papertrail"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
